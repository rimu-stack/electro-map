server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API и WebSocket проксируются напрямую в backend сервис Docker Compose
    location /api/ {
        proxy_pass http://electro-map-back:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SPA fallback — все неизвестные пути отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Отключаем кэширование для index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Статические ассеты — долгий кэш
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
