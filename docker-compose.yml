services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    depends_on:
      - frontend
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Глобальный редирект HTTP → HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      # Let's Encrypt ACME (HTTP-01 challenge)
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=var30000@mail.ru"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"   # Traefik dashboard (закрыть на проде firewall'ом)
    volumes:
      - letsencrypt:/letsencrypt
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./certs:/certs:ro
    networks:
      - proxy

  backend:
    build:
      context: ../electro-map-back
    container_name: electro-map-back
    restart: unless-stopped
    environment:
      - STATE_FILE=/app/data/state.json
    volumes:
      - graph_state:/app/data
    networks:
      - proxy

  frontend:
    build:
      context: .
    container_name: mapa-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - proxy

volumes:
  letsencrypt:
  graph_state:

networks:
  proxy:
    driver: bridge
